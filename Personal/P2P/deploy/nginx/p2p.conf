# ============================================================
# P2P Chat - 系统级 Nginx 反代配置
# 路径: /etc/nginx/sites-available/p2p
# 启用: ln -sf /etc/nginx/sites-available/p2p /etc/nginx/sites-enabled/
# ============================================================

upstream p2p_ws_backend {
    server 127.0.0.1:8889;
    keepalive 32;
}

upstream p2p_api_backend {
    server 127.0.0.1:8890;
}

upstream p2p_web_static {
    server 127.0.0.1:8080;   # 静态文件 (python -m http.server 8080)
}

# ---- HTTP -> HTTPS 跳转 ----
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # certbot 验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 如果有域名 + 证书, 跳 HTTPS; 否则放行
    # return 301 https://$host$request_uri;

    # ---- 纯 HTTP 模式 (临时测试) ----
    location / {
        proxy_pass http://p2p_web_static;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws/ {
        proxy_pass http://p2p_ws_backend/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout  86400s;
    }

    location /api/ {
        proxy_pass http://p2p_api_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

