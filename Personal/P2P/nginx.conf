server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index p2p_web.html;

    # 根路径自动打开聊天室
    location = / {
        rewrite ^ /p2p_web.html;
    }

    # 静态文件直接返回（不额外处理 MIME，nginx 默认已包含）
    location / {
        try_files $uri $uri/ =404;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }
}