name: p2p

# ============================================================
# 统一入口 Nginx (唯一对外暴露端口: 80 + 443)
#   /          -> 静态页 p2p_web.html
#   /ws/       -> WebSocket 信令 (p2p_ws_server:8889)
#   /api/      -> HTTP API (p2p_ws_server:8890)
# ============================================================
services:
  nginx:
    image: nginx:alpine
    container_name: p2p-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites-enabled:/etc/nginx/conf.d:ro
      # SSL 证书 (Caddy 或 certbot 生成的放这里)
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - p2p-web
      - p2p-ws-server
    networks:
      - p2p-net

  p2p-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: p2p-web:latest
    container_name: p2p-web
    restart: unless-stopped
    # ★ 不对外暴露! 只给 nginx 反代
    expose:
      - "80"
    networks:
      - p2p-net

  p2p-ws-server:
    build:
      context: .
      dockerfile: Dockerfile.ws
    image: p2p-ws-server:latest
    container_name: p2p-ws-server
    restart: unless-stopped
    # ★ 不对外暴露! 只给 nginx 反代
    expose:
      - "8889"
      - "8890"
    volumes:
      - ./data:/app/data
    environment:
      TZ: Asia/Shanghai
    networks:
      - p2p-net
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(2); r=s.connect_ex(('127.0.0.1',8889)); s.close(); exit(0 if r==0 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 3s

networks:
  p2p-net:
    driver: bridge
