# ============================================================
# P2P Chat - 统一入口
# 使用: 将 SERVER_NAME 改成你的域名 (例如 p2p.example.com)
# ============================================================

# ---- HTTP -> HTTPS 跳转 ----
server {
    listen 80;
    server_name SERVER_NAME _;

    # 如果有 certbot, 这里放 /.well-known/acme-challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS 主站 ----
server {
    listen 443 ssl;
    server_name SERVER_NAME _;

    # SSL 证书路径 (certbot 会自动放这里)
    # 如果没域名/证书, 可以先用自签名临时测试
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ---- /  -> 静态页 ----
    location / {
        proxy_pass http://p2p-web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- /ws/ -> WebSocket 信令 ----
    # 关键: WebSocket 反代需要 Upgrade + Connection 头
    location /ws/ {
        proxy_pass http://p2p-ws-server:8889/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;      # WS 长连接, 1 天超时
        proxy_send_timeout  86400s;
    }

    # ---- /api/ -> HTTP API (注册/登录) ----
    location /api/ {
        proxy_pass http://p2p-ws-server:8890/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
